# Auto-loads a `.env` file from the working directory if present (local dev
# convenience - works for `mvnw spring-boot:run`, `java -jar`, and IDE run
# configurations alike, without needing to export shell env vars first).
# Silently skipped if absent, so it has no effect in Docker/production where
# real environment variables are set directly.
spring.config.import=optional:file:.env[.properties]

spring.application.name=shopkart
server.port=${PORT:9090}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/salessavvy}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false

# Connection pool (HikariCP) production settings
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONN_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.pool-name=${DB_POOL_NAME:ShopKartHikariPool}

# Enable default security but permit basic/unauthenticated paths via config
jwt.secret=${JWT_SECRET:dev-only-change-me-dev-only-change-me-dev-only-change-me-dev-only-change-me}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}
app.security.bcrypt.strength=${BCRYPT_STRENGTH:10}
app.production=${APP_PRODUCTION:false}
app.security.cookie-secure=${AUTH_COOKIE_SECURE:true}
app.security.cookie-same-site=${AUTH_COOKIE_SAME_SITE:None}
app.seed.demo-data=${SEED_DEMO_DATA:false}
app.seed.admin=${SEED_ADMIN:false}
app.seed.admin.username=${SEED_ADMIN_USERNAME:}
app.seed.admin.email=${SEED_ADMIN_EMAIL:}
app.seed.admin.password=${SEED_ADMIN_PASSWORD:}
app.database.patch-enabled=${DB_PATCH_ENABLED:false}
app.seed.legacy-data=${SEED_LEGACY_DATA:false}

# Enable CORS for specific endpoints
spring.web.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:5174,https://shopkartapp.vercel.app}
spring.web.cors.exposed-headers=*
spring.web.cors.max-age=36000
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5174,https://shopkartapp.vercel.app}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=Content-Type,Authorization
spring.web.cors.allow-credentials=true

logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.com.example.demo.filter=DEBUG

# Gzip JSON/text API responses (off by default in Spring Boot) - cheap win for
# product list/search payloads which are otherwise shipped uncompressed.
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

razorpay.key_id=${RAZORPAY_KEY_ID:}
razorpay.key_secret=${RAZORPAY_KEY_SECRET:}

google.client.id=${GOOGLE_CLIENT_ID:}
